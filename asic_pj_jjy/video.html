<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>视频播放</title>

<style>
  body {
    margin: 0;
    background: #0b1220;
    color: #e5e7eb;
    font-family: system-ui, Arial;

    /* ✅ 关键：用flex纵向布局 */
    display: flex;
    flex-direction: column;

    height: 100vh;
    overflow: hidden; /* ❗禁止滚动 */
  }

  h1 {
    margin: 10px 0;
    text-align: center;
    font-size: 18px;
    flex-shrink: 0;
  }

  .desc {
    text-align: center;
    font-size: 13px;
    color: #9ca3af;
    margin: 6px 0 10px;
    flex-shrink: 0;
  }

  .video-wrapper {
    /* ✅ 核心：吃掉剩余空间 */
    flex: 1;

    display: flex;
    justify-content: center;
    align-items: center;
  }

  video {
    max-width: 100%;
    max-height: 100%;

    object-fit: contain; /* 保证完整显示 */
    border-radius: 12px;
    background: black;
  }
</style>
</head>

<body>

<h1 id="title">视频标题</h1>

<div class="video-wrapper">
  <video controls playsinline preload="metadata">
    <source id="videoSrc" src="" type="video/mp4">
  </video>
</div>

<div class="desc" id="desc">这里是视频简介</div>

<script>
const VIDEO_BASE_URL = "https://media.haiyidawangzifan.xyz";
const VIDEO_FILE = "asic_pj_jjy_video";

const VIDEO_TITLE = "姜佳宇课程作业演示视频";
const VIDEO_DESC = "姜佳宇课程作业演示视频";

const videoUrl = `${VIDEO_BASE_URL}/${VIDEO_FILE}.mp4`;

document.getElementById("videoSrc").src = videoUrl;
document.getElementById("title").textContent = VIDEO_TITLE;
document.getElementById("desc").textContent = VIDEO_DESC;
</script>

</body>
</html>
