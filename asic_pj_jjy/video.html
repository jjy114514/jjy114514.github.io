<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>视频播放</title>

<style>
  body {
    margin: 0;
    background: #0b1220;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
  }

  /* ✅ 核心容器：永远不会超出屏幕 */
  .player-container {
    width: 100vw;
    height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* ✅ 限制视频最大尺寸 */
  video {
    max-width: 100%;
    max-height: 100%;

    width: auto;
    height: auto;

    object-fit: contain;
    background: black;
  }
</style>
</head>

<body>

<div class="player-container">
  <video controls playsinline preload="metadata">
    <source src="https://media.haiyidawangzifan.xyz/asic_pj_jjy_video.mp4" type="video/mp4">
  </video>
</div>

</body>
</html>
